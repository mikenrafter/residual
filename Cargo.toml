[package]
name = "residual"
version = "0.1.0"
edition = "2021"
description = "NKP Residuality architecture CLI — stressor-driven, attractor-aware, probability-free"
license = "MIT"

[[bin]]
name = "residual"
path = "src/main.rs"

[dependencies]
anyhow       = "1.0.104"
thiserror    = "2.0.19"
clap         = { version = "4.5.53", features = ["derive", "env"] }
serde        = { version = "1.0.229", features = ["derive"] }
serde_json   = "1.0.151"
csv          = "1.4.0"
toml         = "1.1.3"
comfy-table  = "7.2.1"
owo-colors   = "4.3.0"
chrono       = { version = "0.4.45", features = ["serde"] }
which        = "8.0.5"

[dev-dependencies]
tempfile     = "3.27.0"
